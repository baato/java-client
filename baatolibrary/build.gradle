plugins {
    id 'com.android.library'
    id 'maven-publish'
    id "com.github.ben-manes.versions" version "0.52.0"
}

android {
    compileSdk = 36

    defaultConfig {
        minSdkVersion 21
        targetSdk = 34
        versionCode 1
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildToolsVersion "36.0.0" // Optional, if matching Build Tools available

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }


    namespace 'com.baato.baatolibrary'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    //graphhopper
    implementation 'com.graphhopper:graphhopper-core:10.2'
    implementation 'com.graphhopper:graphhopper-web-api:10.2'
//    implementation(group: 'com.graphhopper', name: 'graphhopper-core', version: '10.2') {
//        exclude group: 'com.google.protobuf', module: 'protobuf-java'
//        exclude group: 'org.openstreetmap.osmosis', module: 'osmosis-osm-binary'
//        exclude group: 'org.apache.xmlgraphics', module: 'xmlgraphics-commons'
//    }

    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.19.2'
    implementation 'commons-codec:commons-codec:1.19.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.baato'
            artifactId = 'java-client'
            version = '1.4.11'

            afterEvaluate {
                from project.components.findByName('release')
            }
        }
    }
}
